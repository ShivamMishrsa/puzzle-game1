<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Color Gate Blast</title>
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:#141018; color:#f3eadf; font-family:system-ui,Segoe UI,Arial,sans-serif; text-align:center; }
  main { max-width:520px; padding:24px; }
  h1 { font-size:2.2rem; margin:0 0 .4rem; }
  p { line-height:1.5; opacity:.85; }
  a.btn { display:inline-block; margin-top:14px; padding:14px 28px; border-radius:12px; background:#3f7cf4; color:#fff; font-weight:700; text-decoration:none; font-size:1.1rem; }
  #missing { display:none; margin-top:18px; padding:12px 16px; border-radius:10px; background:#3a2a14; font-size:.95rem; }
  code { background:#0004; padding:2px 6px; border-radius:6px; }
</style>
</head>
<body>
<main>
  <h1>Color Gate Blast</h1>
  <p>Slide blocks into their colour gate, load the conveyor turrets, and dismantle the monument piece by piece.</p>
  <a class="btn" id="play" href="play/index.html">Play in your browser</a>
  <div id="missing">The web build has not been published yet. See <code>docs/WEBGL.md</code> in the repository.</div>
  <p style="font-size:.85rem;margin-top:26px">Best on a phone or in a portrait window. Tap once to enable sound.</p>
</main>
<script>
  // Show a friendly note until a build exists in docs/play.
  fetch("play/index.html", { method: "HEAD" }).then(function (r) {
    if (!r.ok) document.getElementById("missing").style.display = "block";
  }).catch(function () { document.getElementById("missing").style.display = "block"; });
</script>
</body>
</html>
