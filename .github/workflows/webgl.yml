name: Build WebGL and deploy to GitHub Pages

# Builds the game with game-ci (Unity in Docker) and publishes it to GitHub Pages.
# One-time setup (see docs/WEBGL.md):
#   1. Add the repository secrets UNITY_LICENSE, UNITY_EMAIL, UNITY_PASSWORD (Unity Personal license).
#   2. Settings > Pages > Build and deployment > Source = "GitHub Actions".
#   3. Optional repository variable UNITY_VERSION (e.g. 6000.3.0f1) if your Unity version differs.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Assets/**"
      - "Packages/**"
      - "ProjectSettings/**"
      - ".github/workflows/webgl.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.c.outputs.ready }}
    steps:
      - id: c
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          if [ -n "$UNITY_LICENSE" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::UNITY_LICENSE secret is missing - the WebGL build is skipped. See docs/WEBGL.md."
          fi

  build:
    needs: check
    if: needs.check.outputs.ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-WebGL-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-WebGL-

      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: WebGL
          unityVersion: ${{ vars.UNITY_VERSION || '6000.3.0f1' }}
          buildMethod: ColorGateBlast.EditorTools.WebBuild.BuildForCI
          customParameters: -customBuildPath /github/workspace/build/WebGL

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/WebGL

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
